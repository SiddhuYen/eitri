[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eitri-hardware"                # the PyPI name ("eitri" is taken; up to 0.5.6 it was "eitri-cad", never on PyPI); the import and the command are both `eitri`
version = "0.8.1"
description = "Hardware design as code: CAD (build123d), wire harnesses, mechanisms, pneumatics, firmware and electronics, with sourced checks on every build; a local AI agent, a browser editor and an MCP server for your own agent."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE.md" }
keywords = ["cad", "build123d", "opencascade", "claude", "3d-printing", "step", "wire-harness"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "License :: Other/Proprietary License",
]
dependencies = [
  "build123d>=0.13",          # the CAD kernel (OpenCASCADE via cadquery-ocp); brings scipy, ezdxf, lib3mf
  "bd_warehouse>=0.4",        # ISO threads, fasteners, bearings
  "numpy>=1.26",
  "pillow>=10",
  "trimesh>=4",               # mesh import/repair, OBJ export, print-plate checks
  "networkx>=3",              # trimesh's hole filling
  "fast_simplification>=0.2", # trimesh's quadric decimation: imported meshes over 200k triangles are decimated (eitri.meshio)
  "anthropic>=1.0",           # API-key check (and the --backend api session)
  "mcp>=1.2",                 # the tool server Claude talks to
  "claude-agent-sdk>=0.2",    # ships the Claude Code binary eitri drives (API key only)
  "PyYAML>=6",                # ticket files (eitri.tickets): ticket.yaml is meant to be read and edited by people
]

[project.urls]
Homepage = "https://eitri.io"
Source = "https://github.com/SiddhuYen/eitri"
Issues = "https://github.com/SiddhuYen/eitri/issues"

[project.optional-dependencies]
pdf = ["playwright>=1.40"]                  # PDF drawings and drawing previews (then: playwright install chromium)
dev = ["pytest>=8", "playwright>=1.40", "PyYAML>=6"]   # PyYAML: a test reads the WireViz YAML eitri writes itself

[project.scripts]
eitri = "eitri.cli:main"
eitri-hardware = "eitri_hardware:main"     # the package's own name, for MCP registries (`uvx eitri-hardware mcp`): the local MCP server

[tool.setuptools.packages.find]
include = ["eitri", "eitri.*", "eitri_hardware"]

[tool.setuptools.package-data]
eitri = [
  "viewer/*.html", "viewer/*.js", "viewer/vendor/**/*",
  "web/*.html", "web/*.css", "web/*.js", "web/assets/**/*",
  "agent/*.md", "lib/*.md",
  "demos/*/demo.json", "demos/*/project.tar.xz", "demos/*/*.py",
  "plugin_bundle/.mcp.json", "plugin_bundle/.claude-plugin/*.json", "plugin_bundle/.claude-plugin/*.png", "plugin_bundle/bin/*",
  "plugin_bundle/assets/*",
  "plugin_bundle/skills/*/SKILL.md", "plugin_bundle/cursor/*.mdc",
  "tickets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
